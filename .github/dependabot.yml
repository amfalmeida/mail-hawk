version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 22
    commit-message:
      prefix: "chore(deps): "
      prefix-development: "chore(deps): "
    labels:
      - "dependencies"
      - "maven"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(gh-actions): "
    labels:
      - "dependencies"
      - "gh-actions"
