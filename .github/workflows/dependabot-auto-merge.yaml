name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge once CI passes
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Enable auto-merge for Dependabot PRs that passed CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ]; then
            echo "CI run is not associated with a pull request — skipping"
            exit 0
          fi
          PR_URL="https://github.com/${{ github.repository }}/pull/${PR_NUMBER}"
          author="$(gh pr view "$PR_URL" --json author --jq '.author.login')"
          if [ "$author" != "dependabot[bot]" ]; then
            echo "$PR_URL is not a Dependabot PR — skipping"
            exit 0
          fi
          echo "Enabling auto-merge for $PR_URL"
          gh pr merge --auto --squash "$PR_URL"
