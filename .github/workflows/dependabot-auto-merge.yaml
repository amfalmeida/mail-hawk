name: Weekly Dependabot Auto-Merge

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9:00 UTC
  workflow_dispatch:   # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Check and enable auto-merge for open Dependabot PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Process open Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Fetching open Dependabot PRs..."
          prs=$(gh pr list --author "dependabot[bot]" --state open --json number,url)
          
          # Check if jq is available or if prs list is empty
          if [ -z "$prs" ] || [ "$prs" = "[]" ]; then
            echo "No open Dependabot PRs found."
            exit 0
          fi

          echo "Found open Dependabot PRs."

          echo "$prs" | jq -c '.[]' | while read -r pr; do
            pr_number=$(echo "$pr" | jq -r '.number')
            pr_url=$(echo "$pr" | jq -r '.url')
            
            echo "Processing PR #$pr_number ($pr_url)..."
            
            # Enable auto-merge; GitHub will merge automatically once CI checks pass
            if gh pr merge --auto --squash "$pr_url"; then
              echo "Successfully enabled auto-merge for PR #$pr_number"
            else
              echo "Could not enable auto-merge for PR #$pr_number (may already be enabled or missing requirements)"
            fi
          done
